name: Build APK

# QATAR: THE PENINSULA -- clean build, test and APK publication.
#
# Evidence policy: CI writes machine readable evidence into artifacts/ and commits it back to the
# branch. A build that does not pass validation publishes nothing and leaves status=FAILED for the
# exact commit it ran on (no stale PASSED can ever approve a later commit).

on:
  push:
    branches: ["**"]
  workflow_dispatch:
    inputs:
      data_run_id:
        description: "World-data run id to download the compiled country bundle from (optional)"
        type: string
        default: ""
      publish_release:
        description: "Publish the APK as a GitHub Release asset when validation passes"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    name: Test, assemble, validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: tools/requirements.txt

      # The source extracts are immutable inputs pinned by the manifest (SRTM tiles and a dated OSM
      # extract are never re-generated), so caching them saves ~30 MB of download per run.
      - name: Cache raw geodata sources
        uses: actions/cache@v4
        with:
          path: data/raw
          key: world-raw-sources-${{ hashFiles('tools/fetch_sources.py') }}-v1

      - name: Restore compiled world bundle from the data run
        if: github.event_name == 'workflow_dispatch' && inputs.data_run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: world-data
          run-id: ${{ inputs.data_run_id }}
          github-token: ${{ github.token }}
          path: .

      - name: Compile the country bundle (only when it is absent)
        if: always()
        run: |
          set +e
          mkdir -p artifacts
          exec > >(tee -a artifacts/WORLD_COMPILE_LOG.txt) 2>&1
          echo "=== world bundle self-sufficiency ==="
          if [ -f android/assets/world/manifest.json ]; then
            echo "bundle already present: $(du -sh android/assets/world | cut -f1)"
            exit 0
          fi
          python3 -m pip install --quiet --upgrade pip
          python3 -m pip install --quiet -r tools/requirements.txt
          echo "--- static self-test of the compiler ---"
          python3 -m pip install --quiet pyflakes
          python3 tools/selftest_world.py 2>&1 | tail -25
          echo "selftest_exit=${PIPESTATUS[0]}"
          echo "--- fetch sources ---"
          python3 tools/fetch_sources.py 2>&1 | tail -25
          echo "fetch_exit=${PIPESTATUS[0]}"
          echo "--- compile ---"
          python3 tools/build_world.py --stage all 2>&1 | tail -45
          echo "compile_exit=${PIPESTATUS[0]}"
          echo "--- validate ---"
          python3 tools/validate_world.py 2>&1 | tail -12
          echo "validate_exit=${PIPESTATUS[0]}"
          echo "=== bundle contents ==="
          ls -la android/assets/world/ 2>&1 | head -20
          du -sh android/assets/world/ 2>&1

      - name: Confirm world bundle present (packaged-country startup depends on it)
        if: always()
        run: |
          ls -la android/assets/world/ 2>&1 | head -20 || true
          if [ -f android/assets/world/manifest.json ]; then
            echo "world bundle present: $(du -sh android/assets/world | cut -f1)"
          else
            echo "WARNING: no compiled world bundle in the workspace yet"
          fi

      - name: Ensure Android SDK components
        run: |
          set -e
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          export ANDROID_SDK_ROOT="$SDK_ROOT"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          SDKM="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKM" ] || { echo "sdkmanager missing at $SDKM"; ls "$SDK_ROOT"; exit 1; }
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0" "platform-tools" || true

      - name: Reset prior QA status (stale PASSED may never approve a build)
        run: |
          mkdir -p artifacts
          rm -f artifacts/QA_STATUS.txt artifacts/APK_VALIDATION.txt artifacts/UNIT_TEST_STATUS.txt
          {
            echo "commit=${GITHUB_SHA}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "run_url=https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "branch=${GITHUB_REF_NAME}"
            echo "started_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > artifacts/BUILD_META.txt

      - name: Run JVM test suites (geography, physics, text)
        run: |
          set +e
          gradle --no-daemon --stacktrace :core:test 2>&1 | tee unit.log
          STATUS=${PIPESTATUS[0]}
          set -e
          {
            echo "stage=unit-tests"
            echo "gradle_exit=$STATUS"
          } >> artifacts/BUILD_META.txt
          grep -B3 -A10 -E "error:|FAILED|Caused by" unit.log | tail -500 > artifacts/UNIT_TEST_LOG.txt || true
          if [ "$STATUS" -eq 0 ]; then echo "status=PASSED" > artifacts/UNIT_TEST_STATUS.txt;
          else echo "status=FAILED" > artifacts/UNIT_TEST_STATUS.txt; fi
          find core/build/test-results -name '*.xml' -exec grep -h -o 'tests="[0-9]*" skipped="[0-9]*" failures="[0-9]*" errors="[0-9]*"' {} \; \
            | awk -F'"' '{t+=$2; s+=$4; f+=$6; e+=$8} END {printf "tests=%d skipped=%d failures=%d errors=%d\n", t, s, f, e}' \
            > artifacts/UNIT_TEST_SUMMARY.txt 2>/dev/null || echo "tests=unknown" > artifacts/UNIT_TEST_SUMMARY.txt
          cat artifacts/UNIT_TEST_SUMMARY.txt
          cat artifacts/UNIT_TEST_STATUS.txt
          exit 0

      - name: Assemble debug APK for all supported ABIs
        run: |
          set +e
          gradle --no-daemon --stacktrace :android:assembleDebug 2>&1 | tee apk.log
          STATUS=${PIPESTATUS[0]}
          set -e
          {
            echo "stage=assemble"
            echo "assemble_exit=$STATUS"
          } >> artifacts/BUILD_META.txt
          grep -B3 -A10 -E "error:|FAILED|Caused by|what went wrong" apk.log | tail -500 > artifacts/APK_BUILD_LOG.txt || true
          exit 0

      - name: Validate APK and produce evidence
        continue-on-error: true
        run: |
          set -e
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          export PATH="$SDK_ROOT/build-tools/34.0.0:$PATH"
          APK=$(find android/build/outputs/apk/debug -name '*.apk' | head -1)
          if [ -z "$APK" ]; then
            echo "validation=FAILED (no APK produced)" > artifacts/APK_VALIDATION.txt
            cat artifacts/APK_VALIDATION.txt
            exit 0
          fi
          cp "$APK" artifacts/Qatar-The-Peninsula-v0.1.0-m0.apk
          bash tools/validate_apk.sh artifacts/Qatar-The-Peninsula-v0.1.0-m0.apk artifacts/APK_VALIDATION.txt || true
          cat artifacts/APK_VALIDATION.txt

      - name: Decide QA status for this commit
        id: qa
        run: |
          set -e
          UNIT=$(grep -c "status=PASSED" artifacts/UNIT_TEST_STATUS.txt || true)
          VALID=$(grep -c "validation=PASSED" artifacts/APK_VALIDATION.txt 2>/dev/null || true)
          if [ "$UNIT" -eq 1 ] && [ "$VALID" -eq 1 ]; then
            echo "status=PASSED" > artifacts/QA_STATUS.txt
            echo "passed=true" >> "$GITHUB_OUTPUT"
          else
            echo "status=FAILED" > artifacts/QA_STATUS.txt
            echo "passed=false" >> "$GITHUB_OUTPUT"
          fi
          cat artifacts/QA_STATUS.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qatar-peninsula-apk
          path: artifacts/
          if-no-files-found: warn

      - name: Commit build evidence to the branch
        if: always()
        continue-on-error: true
        run: |
          set -e
          git config user.name "qatar-ci"
          git config user.email "ci@users.noreply.github.com"
          git add -A artifacts/ || true
          # The compiled country bundle is a build product of this repository that the APK must
          # contain, so it travels with the evidence commit.
          git add android/assets/world data/geodata || true
          git commit -m "CI evidence for ${GITHUB_SHA} [skip ci]" || echo "no evidence changes"
          for i in 1 2 3; do
            git fetch origin "${GITHUB_REF_NAME}" || true
            git merge -X ours --no-edit FETCH_HEAD -m "merge evidence [skip ci]" || git merge --abort || true
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then echo "evidence pushed"; break; fi
            sleep 5
          done

      - name: Enforce QA gate (fail the run when the commit did not pass)
        if: always() && steps.qa.outputs.passed != 'true'
        run: |
          echo "QA gate: status is not PASSED for ${GITHUB_SHA}"
          echo "--- unit tests ---"; cat artifacts/UNIT_TEST_STATUS.txt 2>/dev/null || true
          echo "--- apk validation ---"; cat artifacts/APK_VALIDATION.txt 2>/dev/null || true
          exit 1

      - name: Publish GitHub Release with the validated APK
        if: success() && steps.qa.outputs.passed == 'true' && github.event_name == 'workflow_dispatch' && inputs.publish_release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          TAG="v0.1.0-m0-build-${GITHUB_RUN_NUMBER}"
          APK="artifacts/Qatar-The-Peninsula-v0.1.0-m0.apk"
          sha256sum "$APK" > "$APK.sha256"
          gh release create "$TAG" "$APK" "$APK.sha256" \
            --title "Qatar: The Peninsula $TAG" \
            --notes "Automated milestone build of commit ${GITHUB_SHA}. Validation report: artifacts/APK_VALIDATION.txt in the repository (validation=PASSED)." \
            || echo "release creation failed"
