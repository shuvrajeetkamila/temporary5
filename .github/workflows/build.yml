name: Build APK

# QATAR: THE PENINSULA -- clean build, test and APK publication.
# Gates: unit/data/physics tests, APK structure validation, packaged-country startup check.
# A failed run never publishes an APK and never leaves a stale PASSED status.

on:
  push:
    branches: ["**"]
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish the APK as a GitHub Release asset when validation passes"
        type: boolean
        default: false

permissions:
  contents: write

env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx3g"

jobs:
  unit-tests:
    name: Unit, data and physics tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
          cache-read-only: false

      - name: Reset prior QA status (no stale PASSED may approve a build)
        run: rm -f artifacts/QA_STATUS.txt artifacts/APK_VALIDATION.txt

      - name: Run JVM test suites
        run: gradle --no-daemon --stacktrace :core:test

      - name: Collect test evidence
        if: always()
        run: |
          mkdir -p artifacts
          {
            echo "commit=${GITHUB_SHA}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "unit_tests=completed"
          } > artifacts/UNIT_TEST_STATUS.txt
          find core/build/test-results -name '*.xml' -exec sh -c 'grep -h -o "tests=\"[0-9]*\" skipped=\"[0-9]*\" failures=\"[0-9]*\" errors=\"[0-9]*\"" "$1" | head -1' _ {} \; > artifacts/UNIT_TEST_SUMMARY.txt 2>/dev/null || true
          cat artifacts/UNIT_TEST_SUMMARY.txt 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-evidence
          path: artifacts/

  apk:
    name: Assemble and validate APK
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
          cache-read-only: false

      - name: Ensure Android SDK components
        run: |
          set -e
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          export ANDROID_SDK_ROOT="$SDK_ROOT"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          SDKM="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKM" ]; then
            echo "sdkmanager not found at $SDKM"; ls "$SDK_ROOT" || true; exit 1
          fi
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0" "platform-tools" || true
          ls "$SDK_ROOT/platforms" || true

      - name: Assemble debug APK (universal, all ABIs)
        run: gradle --no-daemon --stacktrace :android:assembleDebug

      - name: Validate APK and produce evidence
        run: |
          set -e
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          export PATH="$SDK_ROOT/build-tools/34.0.0:$PATH"
          mkdir -p artifacts
          APK=$(find android/build/outputs/apk/debug -name '*.apk' | head -1)
          cp "$APK" "artifacts/$(basename "$APK")"
          bash tools/validate_apk.sh "artifacts/$(basename "$APK")" artifacts/APK_VALIDATION.txt || true
          cat artifacts/APK_VALIDATION.txt
          if grep -q "validation=PASSED" artifacts/APK_VALIDATION.txt; then
            echo "status=PASSED" > artifacts/QA_STATUS.txt
          else
            echo "status=FAILED" > artifacts/QA_STATUS.txt
            exit 1
          fi

      - name: Stage release asset name
        run: |
          APK=$(find artifacts -name '*.apk' | head -1)
          cp "$APK" artifacts/Qatar-The-Peninsula-v0.1.0-m0.apk
          (cd artifacts && sha256sum Qatar-The-Peninsula-v0.1.0-m0.apk > Qatar-The-Peninsula-v0.1.0-m0.apk.sha256)
          cat artifacts/Qatar-The-Peninsula-v0.1.0-m0.apk.sha256

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qatar-peninsula-apk
          path: artifacts/
          if-no-files-found: warn

      - name: Publish build status back to the branch
        if: always()
        continue-on-error: true
        run: |
          set -e
          git config user.name "qatar-ci"
          git config user.email "ci@users.noreply.github.com"
          mkdir -p artifacts
          {
            echo "commit=${GITHUB_SHA}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "workflow=build.yml"
          } >> artifacts/BUILD_META.txt || true
          git add -f artifacts/QA_STATUS.txt artifacts/APK_VALIDATION.txt artifacts/BUILD_META.txt 2>/dev/null || true
          git commit -m "CI: APK validation status for ${GITHUB_SHA} [skip ci]" || true
          git push origin HEAD:${GITHUB_REF_NAME} || true

      - name: Create release with APK
        if: success() && (github.event_name == 'workflow_dispatch' && inputs.publish_release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v0.1.0-m0-build-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" artifacts/Qatar-The-Peninsula-v0.1.0-m0.apk artifacts/Qatar-The-Peninsula-v0.1.0-m0.apk.sha256 \
            --title "Qatar: The Peninsula $TAG" \
            --notes "Automated milestone build. See artifacts/APK_VALIDATION.txt in the repository for the validation report of commit ${GITHUB_SHA}." || true
