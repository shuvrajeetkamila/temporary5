name: Compile gate

# The fastest job that can tell whether the code is broken. It compiles every Java source and every
# test source, and runs the Python tool gates, in a couple of minutes -- before the multi-minute world
# compile and APK assembly even start.
#
# Why this exists: the world data job spends minutes downloading and compiling the country, and the APK
# job spends more assembling it. Without a gate, a one-character type error in a new mesh builder would
# only be discovered twenty minutes later, at the end of the pipeline. Compilers are cheap; use them
# first.

on:
  push:
    branches: ["**"]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compile:
    name: javac + tool gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Java symbol gate (names, before the compiler spends a minute on it)
        run: python3 tools/check_java_symbols.py

      - name: Shader gate (the three failures a device reported, read out of the source)
        run: python3 tools/check_shaders.py

      - name: Local name gate (a duplicate local is a compile error, and javac is not here to say so)
        run: |
          python3 -m pip install --quiet tree-sitter tree-sitter-java
          python3 tools/check_local_names.py

      - name: Narrowing gate (a double assigned to a float is a compile error too)
        run: python3 tools/check_float_narrowing.py

      - name: Format gate (a specifier that refuses its value is a runtime exception on a phone)
        run: python3 tools/check_format_specifiers.py

      - name: Compile game code and tests
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace :core:compileJava :core:compileTestJava 2>&1 | tee compile.log
          echo "compile_exit=${PIPESTATUS[0]}"

      - name: Python tool gates (self-tests and validators on the synthetic fixture)
        run: |
          python3 -m pip install --quiet --upgrade pip
          # The stage 1 self-test exercises the real land-mask derivation, so it needs the full
          # compiler dependency set, not just the packers' subset.
          python3 -m pip install --quiet -r tools/requirements.txt
          python3 -m pip install --quiet pyflakes
          echo "--- stage 1 compiler self-test ---"
          python3 tools/selftest_world.py 2>&1 | tail -6
          echo "--- game world bundle contracts + fixture ---"
          python3 tools/selftest_game_world.py 2>&1 | tail -8
          echo "--- validate the synthetic game bundle ---"
          python3 tools/validate_game_world.py --world core/src/test/resources/synthetic_world --synthetic 2>&1 | tail -4

      - name: Report
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p artifacts notclean
          {
            echo "commit=${GITHUB_SHA}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "url=https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "finished_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > artifacts/COMPILE_GATE.txt
          tail -120 compile.log >> artifacts/COMPILE_GATE.txt 2>/dev/null || true
          # Compile errors must be readable from the repository: CI logs live on a storage host that is
          # not always reachable, and an unreadable error is an unfixable error.
          #
          # Two lines of context after each error, because javac puts the answer there and not on the
          # line that matched: `error: cannot find symbol` is followed by the line it is on, then
          # `symbol: method getArgumentClass()` and `location: variable refusal of type ...`. Without
          # -A 2 the evidence kept the error and dropped the symbol, and one cycle was spent reading the
          # JDK's source to find out what the compiler had already said.
          grep -A 2 -E "error:|error\b.*\.java" compile.log > notclean/COMPILE_ERRORS.txt 2>/dev/null || true
          tail -5 artifacts/COMPILE_GATE.txt

      - name: Publish the compile log to the repository
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          REPO="${GITHUB_REPOSITORY}"
          BRANCH="${GITHUB_REF_NAME}"
          for pair in "artifacts/COMPILE_GATE.txt:artifacts/compile/COMPILE_GATE.txt" \
                      "notclean/COMPILE_ERRORS.txt:artifacts/compile/COMPILE_ERRORS.txt"; do
            src="${pair%%:*}"; dest="${pair##*:}"
            [ -f "$src" ] || continue
            for attempt in 1 2 3; do
              sha=$(gh api "repos/${REPO}/contents/${dest}?ref=${BRANCH}" --jq .sha 2>/dev/null || true)
              args=(-X PUT "repos/${REPO}/contents/${dest}" -f message="Compile gate log [skip ci]" \
                    -f branch="${BRANCH}" -f content="$(base64 -w0 "$src")")
              [ -n "$sha" ] && args+=(-f sha="$sha")
              if gh api "${args[@]}" >/dev/null 2>&1; then echo "published $dest"; break; fi
              sleep 3
            done
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compile-gate
          path: artifacts/COMPILE_GATE.txt
          retention-days: 30
